<!DOCTYPE html>
<html lang="es"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Recetas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&amp;family=Work+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2A1E16;
  --paper:#FBF1DE;
  --paper-2:#F1DFB9;
  --chile:#D8402B;
  --elote:#F2AE2E;
  --tomatillo:#577A3D;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#F5EAD9;
    --paper:#1E140F;
    --paper-2:#2A1D15;
    --chile:#FF7A5C;
    --elote:#FFC968;
    --tomatillo:#8CBB6C;
  }
}
:root[data-theme="dark"]{
  --ink:#F5EAD9;--paper:#1E140F;--paper-2:#2A1D15;
  --chile:#FF7A5C;--elote:#FFC968;--tomatillo:#8CBB6C;
}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:'Work Sans',system-ui,sans-serif;
  line-height:1.55;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  overflow-x:hidden;
}
a{color:inherit;}
:focus-visible{outline:3px solid var(--tomatillo);outline-offset:3px;}

.hero{padding:5rem 1.5rem 4rem;text-align:center;}
.wordmark{
  font-family:'Baloo 2',sans-serif;
  font-weight:800;
  font-size:clamp(2.6rem,11vw,4.6rem);
  color:var(--paper);
  background:var(--chile);
  display:inline-block;
  padding:0.2em 0.6em;
  border-radius:40% 60% 58% 42%/48% 40% 60% 52%;
  transform:rotate(-3deg);
  margin:0 0 1.6rem;
}
.tagline{
  font-size:clamp(1.1rem,3vw,1.35rem);
  max-width:30ch;
  margin:0 auto 2rem;
}
.cta{
  display:inline-block;
  background:var(--ink);
  color:var(--paper);
  font-family:'Work Sans',sans-serif;
  font-weight:600;
  text-decoration:none;
  padding:0.9em 1.8em;
  border-radius:999px;
}
.cta:hover{background:var(--chile);}

.menu{padding:1rem 1.5rem 4rem;}
.menu h2{
  font-family:'Baloo 2',sans-serif;
  font-weight:700;
  font-size:clamp(1.5rem,4vw,2rem);
  max-width:640px;
  margin:0 auto 2rem;
  text-align:center;
}
.menu-row{
  display:flex;
  gap:1.2rem;
  align-items:flex-start;
  max-width:560px;
  margin:0 auto;
}
.menu-row + .menu-row{
  margin-top:2.2rem;
  padding-top:2.2rem;
  border-top:2px dotted var(--paper-2);
}
.menu-icon{
  flex:none;
  width:3.4rem;height:3.4rem;
  border-radius:50%;
  background:var(--paper-2);
  display:flex;align-items:center;justify-content:center;
  font-size:1.5rem;
}
.menu-text h3{
  font-family:'Baloo 2',sans-serif;
  font-weight:700;
  font-size:1.25rem;
  margin:0 0 0.4rem;
}
.menu-text p{margin:0;max-width:42ch;}

.closer{
  background:var(--paper-2);
  text-align:center;
  padding:3rem 1.5rem calc(3rem + env(safe-area-inset-bottom,0px));
}
.closer p{margin:0 0 1.2rem;}
.handle{
  display:inline-block;
  font-family:'Baloo 2',sans-serif;
  font-weight:700;
  font-size:1.3rem;
  text-decoration:none;
  border-bottom:3px solid var(--chile);
}
</style>
<style id="lienzo-blocks">/* bloque:whatsapp */
.lzb-wa{display:inline-flex;align-items:center;gap:8px;padding:13px 24px;border-radius:999px;background:#1fa855;color:#fff;font-weight:700;text-decoration:none;font-family:inherit;line-height:1.2}
</style>
</head>
<body><header class="hero">
  <h1 class="wordmark">MuyGud</h1>
  <p class="tagline">Lugares que valen la pena, recetas que sí quedan.</p>
  <a class="cta" href="https://www.instagram.com/muygud/" target="_blank" rel="noopener">Síguenos en Instagram</a>
</header><main>
    <section>
      <h1>Recetas</h1>
      <p>Escribe aquí el contenido de esta página. Usa el panel “Añadir” para agregar secciones.</p>
    </section>
    
  </main><footer class="closer">
  <p>Todo el contenido vive en Instagram.</p>
  <a class="handle" href="https://www.instagram.com/muygud/" target="_blank" rel="noopener">@muygud</a>
</footer><a class="lzb-wa" href="https://wa.me/5215512345678?text=Hola%2C%20quiero%20m%C3%A1s%20informaci%C3%B3n" target="_blank" rel="noopener" style="--lz-accent: #e5007d; --lz-on-accent: #ffffff;">Escríbenos por WhatsApp</a></body></html>
